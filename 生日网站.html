<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height:100vh;
    background:#070b1a;
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    overflow:hidden;
    color:#fff;
    user-select:none;
  }

  /* ===== 星空背景 ===== */
  #space {
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at 50% 40%, #141b3d 0%, #070b1a 70%);
    z-index:0;
    overflow:hidden;
  }
  .star-dot {
    position:absolute;
    background:#fff;
    border-radius:50%;
    animation:twinkle var(--d,3s) infinite ease-in-out;
  }
  @keyframes twinkle {
    0%,100%{ opacity:.2; transform:scale(.8); }
    50%{ opacity:1; transform:scale(1.3); }
  }

  /* 星云 */
  .nebula {
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:.35;
    animation:drift 20s infinite alternate ease-in-out;
  }
  @keyframes drift {
    from { transform:translate(0,0) scale(1); }
    to { transform:translate(40px,-30px) scale(1.15); }
  }

  /* ===== 主舞台 ===== */
  #stage {
    position:relative;
    z-index:10;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:1.5rem;
  }

  /* 起始屏幕 */
  .screen {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:2rem;
    text-align:center;
    transition:opacity .8s ease, transform .8s ease;
  }
  .screen.hidden {
    opacity:0;
    pointer-events:none;
    transform:scale(.92);
  }

  /* --- 开场 --- */
  #intro .planet-big {
    font-size:7rem;
    animation:bob 4s infinite ease-in-out;
    filter:drop-shadow(0 0 30px #7a6bff);
  }
  @keyframes bob {
    0%,100%{ transform:translateY(0) rotate(-3deg); }
    50%{ transform:translateY(-18px) rotate(3deg); }
  }
  #intro h1 {
    font-size:clamp(1.4rem,5vw,2.2rem);
    font-weight:400;
    letter-spacing:.3em;
    margin:1rem 0 .5rem;
    color:#c9c2ff;
  }
  #intro h2 {
    font-size:clamp(2.2rem,9vw,4rem);
    font-weight:800;
    background:linear-gradient(120deg,#ff9ec7,#ffd36e,#a78bfa);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:1.5rem;
    text-shadow:0 0 40px rgba(255,158,199,.4);
  }
  .hint {
    font-size:1rem;
    color:#8f9bd4;
    letter-spacing:.15em;
    animation:pulse 2s infinite;
    margin-top:1rem;
  }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

  /* 通用按钮 */
  .btn {
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-size:1.15rem;
    font-weight:700;
    letter-spacing:.1em;
    padding:1rem 2.4rem;
    border-radius:50px;
    color:#fff;
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
    box-shadow:0 10px 30px rgba(139,92,246,.45);
    transition:transform .15s, box-shadow .15s;
  }
  .btn:hover { transform:translateY(-3px); box-shadow:0 16px 36px rgba(236,72,153,.5); }
  .btn:active { transform:translateY(1px) scale(.98); }

  /* --- 行星选择 --- */
  #universe .title {
    font-size:clamp(1.3rem,4.5vw,2rem);
    font-weight:700;
    color:#fff;
    margin-bottom:.4rem;
  }
  #universe .sub {
    color:#9aa4d8;
    font-size:.95rem;
    margin-bottom:2.5rem;
    letter-spacing:.1em;
  }
  .planets {
    position: relative;
    width: min(88vw, 760px);
    height: min(62vh, 480px);
    max-width: 760px;
    display: block;
    margin-top: 0.5rem;
  }
  .planet {
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .3s ease;
    font-size:2.6rem;
    color:#fff;
    box-shadow:inset -12px -12px 30px rgba(0,0,0,.4), 0 0 30px var(--glow);
    animation:orbitFloat 5s infinite ease-in-out;
  }
  .planet:nth-child(2){ animation-delay:-1.5s; }
  .planet:nth-child(3){ animation-delay:-3s; }
  @keyframes orbitFloat {
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-14px); }
  }
  .planet:hover { transform:scale(1.1); }
  .planet small {
    font-size:.8rem;
    letter-spacing:.1em;
    margin-top:.4rem;
    opacity:.85;
    font-weight:600;
  }
  .p1 { background:radial-gradient(circle at 30% 30%, #ffb36b, #c2410c); --glow:#ff9d4d; }
  .p2 { background:radial-gradient(circle at 30% 30%, #7dd3fc, #1d4ed8); --glow:#38bdf8; }
  .p3 { background:radial-gradient(circle at 30% 30%, #f9a8d4, #9d174d); --glow:#f472b6; }
  /* ===== 三颗主星球分散位置 ===== */
  .planet.p1 { top: 4%;  left: 6%;  }
  .planet.p2 { top: 2%;  right: 8%; }
  .planet.p3 {
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    animation: orbitFloatCenter 5s infinite ease-in-out;
  }
  @keyframes orbitFloatCenter {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%     { transform: translateX(-50%) translateY(-14px); }
  }
  .planet.p3:hover { transform: translateX(-50%) scale(1.1); }

  /* ===== 小星球装饰 ===== */
  #universe { overflow: hidden; }
  .mini-planet {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.55;
    animation: miniFloat 7s infinite ease-in-out;
    box-shadow: inset -4px -4px 10px rgba(0,0,0,.4);
  }
  .mini-planet::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.12);
    transform: rotate(-20deg) scaleY(0.45);
  }
  @keyframes miniFloat {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-10px); }
  }
  .mini-1 { width:26px; height:26px; background:radial-gradient(circle at 30% 30%,#ffd36e,#b45309); top:18%; left:38%; animation-delay:-1s; }
  .mini-2 { width:18px; height:18px; background:radial-gradient(circle at 30% 30%,#7dd3fc,#1e3a8a); top:30%; right:32%; animation-delay:-3s; }
  .mini-3 { width:34px; height:34px; background:radial-gradient(circle at 30% 30%,#f9a8d4,#831843); bottom:20%; left:20%; animation-delay:-2s; }
  .mini-4 { width:22px; height:22px; background:radial-gradient(circle at 30% 30%,#a78bfa,#4c1d95); bottom:26%; right:22%; animation-delay:-4s; }
  .mini-5 { width:14px; height:14px; background:radial-gradient(circle at 30% 30%,#6ee7b7,#065f46); top:52%; left:4%; animation-delay:-5s; }
  .mini-6 { width:16px; height:16px; background:radial-gradient(circle at 30% 30%,#fde047,#a16207); top:8%; right:44%; animation-delay:-2.5s; }

  /* --- 内容卡片 --- */
  #content {
    width:100%;
    max-width:680px;
  }
  .story-card {
    background:rgba(20,26,58,.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(160,150,255,.25);
    border-radius:28px;
    padding:2.5rem 2rem;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 0 60px rgba(120,90,255,.08);
    animation:cardIn .6s ease;
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(24px) scale(.97); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }
  .story-card .emoji {
    font-size:3.5rem;
    display:block;
    margin-bottom:1rem;
    animation:bob 3s infinite ease-in-out;
  }
  .story-card h3 {
    font-size:1.7rem;
    margin-bottom:1.2rem;
    background:linear-gradient(90deg,#c4b5fd,#f9a8d4);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .story-card p {
    font-size:1.15rem;
    line-height:2;
    color:#d6d9f5;
    margin-bottom:1rem;
  }
  .story-card .accent { color:#ffd36e; font-weight:700; }
  .story-card .big {
    display:block;
    font-size:1.6rem;
    font-weight:800;
    margin:1.2rem 0;
    color:#fff;
    text-shadow:0 0 24px rgba(244,114,182,.7);
  }

  /* 小彩蛋打字区 */
  .typewriter {
    font-family:'Courier New',monospace;
    color:#a5f3fc;
    font-size:1rem;
    letter-spacing:.05em;
    min-height:1.5em;
    margin-top:1.2rem;
  }

  /* 返回按钮 */
  .back-btn {
    background:transparent;
    border:1.5px solid rgba(160,150,255,.5);
    color:#c4b5fd;
    font-size:.95rem;
    padding:.7rem 1.8rem;
    border-radius:50px;
    cursor:pointer;
    margin-top:1.8rem;
    font-family:inherit;
    letter-spacing:.1em;
    transition:.2s;
  }
  .back-btn:hover { background:rgba(160,150,255,.15); border-color:#c4b5fd; }

  /* 最终彩蛋 —— 全屏烟花祝福 */
  #finale {
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:radial-gradient(circle at 50% 50%, rgba(40,20,80,.55), rgba(7,11,26,.92));
    backdrop-filter:blur(6px);
    padding:2rem;
  }
  #finale.active { display:flex; animation:cardIn .8s ease; }
  #finale .big-wish {
    font-size:clamp(2rem,10vw,5rem);
    font-weight:900;
    line-height:1.2;
    background:linear-gradient(120deg,#ffd36e,#ff9ec7,#a78bfa,#7dd3fc);
    background-size:300% 300%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shine 4s linear infinite;
    margin-bottom:1.5rem;
  }
  @keyframes shine {
    0%{ background-position:0% 50%; }
    100%{ background-position:300% 50%; }
  }
  #finale .sub-wish {
    color:#e0dcff;
    font-size:clamp(1rem,3.5vw,1.4rem);
    line-height:2;
    max-width:600px;
    letter-spacing:.05em;
  }
  #finale .hearts {
    font-size:2.2rem;
    margin:1.6rem 0;
    letter-spacing:.4em;
    animation:pulse 1.6s infinite;
  }

  /* ===== 烟花画布 ===== */
  #fireworks {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:99;
  }

  /* 声音提示（可选，静音） */
  .sound-note {
    position:fixed;
    bottom:16px;
    right:20px;
    z-index:50;
    font-size:.8rem;
    color:#5f6b9e;
    letter-spacing:.1em;
  }

  /* ===== 时间系统 ===== */
  .time-display {
    margin-top: 1.6rem;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
    color: #9aa4d8;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .time-display .clock {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 1.1rem;
    color: #ffd36e;
    text-shadow: 0 0 16px rgba(255,211,110,0.5);
    letter-spacing: 0.08em;
  }
  .time-display .greet {
    color: #c4b5fd;
  }
  .time-display .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #6ee7b7;
    box-shadow: 0 0 10px #6ee7b7;
    animation: pulse 2s infinite;
  }
  /* ===== 生日倒计时 / 当天徽章 ===== */
  .birthday-badge {
    margin-top: 1rem;
    display: inline-block;
    padding: 0.7rem 1.6rem;
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #fff;
    background: linear-gradient(135deg, #ff9ec7, #ffd36e, #a78bfa);
    background-size: 200% 200%;
    animation: badgeShine 3s linear infinite, pulse 2s infinite;
    box-shadow: 0 0 24px rgba(255,158,199,0.6);
    border: 1px solid rgba(255,255,255,0.4);
  }
  @keyframes badgeShine {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  /* 非生日当天显示倒计时 */
  .countdown {
    margin-top: 1rem;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    color: #9aa4d8;
  }
  .countdown strong {
    color: #ffd36e;
    font-family: 'Courier New', monospace;
    font-size: 1.15rem;
    text-shadow: 0 0 14px rgba(255,211,110,0.5);
    margin: 0 0.15rem;
  }

  @media (max-width:600px) {
    .planets {
      width: 92vw;
      height: 56vh;
      min-height: 360px;
    }
    .planet {
      width: 104px;
      height: 104px;
      font-size: 2.1rem;
    }
    .planet.p1 { top: 0; left: 2%; }
    .planet.p2 { top: 0; right: 2%; }
    .planet.p3 { bottom: 2%; }
    .story-card { padding:1.8rem 1.2rem; }
    .story-card p { font-size:1rem; }
  }
</style>
</head>
<body>

<div id="space">
  <div class="nebula" style="width:380px;height:380px;background:#6d28d9;top:-80px;left:-80px;"></div>
  <div class="nebula" style="width:300px;height:300px;background:#db2777;bottom:-60px;right:-60px;animation-delay:-6s;"></div>
  <div class="nebula" style="width:240px;height:240px;background:#0ea5e9;top:50%;left:70%;animation-delay:-12s;"></div>
</div>

<div id="stage">

  <!-- 开场 -->
  <section class="screen" id="intro">
    <div class="planet-big">🪐</div>
    <h1>欢迎来到</h1>
    <h2>生日宇宙</h2>
    <button class="btn" id="startBtn">🚀 启程探索</button>
    <p class="hint">点击启程 · 共有 3 颗星球等你点亮</p>
        <div class="time-display">
      <span class="dot"></span>
      <span class="clock" id="liveClock">--:--:--</span>
      <span class="greet" id="timeGreet">正在读取此刻…</span>
    </div>
    <div class="birthday-badge" id="birthdayBadge" style="display:none;">
      🎂 今天是 11 月 22 日 · 你的生日！
    </div>
  </section>

  <!-- 星图 / 选择行星 -->
  <section class="screen hidden" id="universe">
    <div class="title">🌟 生日星图已解锁</div>
    <div class="sub">选一颗星球降落吧</div>
        <div class="planets">
      <!-- 背景小星球装饰 -->
      <div class="mini-planet mini-1"></div>
      <div class="mini-planet mini-2"></div>
      <div class="mini-planet mini-3"></div>
      <div class="mini-planet mini-4"></div>
      <div class="mini-planet mini-5"></div>
      <div class="mini-planet mini-6"></div>

      <!-- 三颗主星球 -->
      <div class="planet p1" data-planet="1">
        🌟
        <small>愿望星</small>
      </div>
      <div class="planet p2" data-planet="2">
        💧
        <small>回忆星</small>
      </div>
      <div class="planet p3" data-planet="3">
        🎁
        <small>惊喜星</small>
      </div>
    </div>
    <p class="hint" style="margin-top:2.5rem;">每颗星球都藏着给你的话</p>
  </section>

  <!-- 星球内容 -->
  <section class="screen hidden" id="content">
    <div class="story-card" id="storyCard">
      <!-- 动态填充 -->
    </div>
    <div style="text-align:center;">
      <button class="back-btn" id="backBtn">← 返回星图</button>
    </div>
  </section>

</div>

<!-- 最终彩蛋 -->
<div id="finale">
  <div class="big-wish">孙梦羽<br>生日快乐！</div>
  <div class="hearts">💖 ✨ 🎂 ✨ 💖</div>
  <div class="sub-wish">
    你点亮了所有的星球<br>
    愿你的未来，也像这片星空一样，<br>
    璀璨、自由、无限可能。
  </div>
  <button class="btn" style="margin-top:2rem;" onclick="location.reload()">🔄 再逛一次宇宙</button>
</div>

<canvas id="fireworks"></canvas>

<script>
/* ========== 1. 星空背景生成 ========== */
(function generateStars() {
  const space = document.getElementById('space');
  const count = 140;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.classList.add('star-dot');
    const size = Math.random() * 3 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--d', (Math.random() * 3 + 2) + 's');
    s.style.animationDelay = (Math.random() * 5) + 's';
    space.appendChild(s);
  }
})();

/* ========== 2. 页面切换逻辑 ========== */
const intro = document.getElementById('intro');
const universe = document.getElementById('universe');
const content = document.getElementById('content');
const storyCard = document.getElementById('storyCard');
const startBtn = document.getElementById('startBtn');
const backBtn = document.getElementById('backBtn');

let visited = new Set();

startBtn.addEventListener('click', () => {
  intro.classList.add('hidden');
  universe.classList.remove('hidden');
});

backBtn.addEventListener('click', () => {
  content.classList.add('hidden');
  universe.classList.remove('hidden');
});

/* ========== 3. 每颗星球的内容 ========== */
const planetsData = {
  1: {
    emoji: '🌟',
    title: '愿望星 · 给未来的你',
    html: `
      <p>据说在愿望星上，写下的心愿会随着星光抵达宇宙尽头。</p>
      <p>所以——</p>
      <span class="big">愿你许下的每一个愿望<br>都有人回应，有迹可循</span>
      <p>愿你永远保有<span class="accent">做梦的勇气</span>，<br>也拥有<span class="accent">实现梦想的运气</span>。</p>
      <div class="typewriter" id="type1"></div>
    `,
    typeText: '> 愿你所愿皆成真，所行化坦途。'
  },
  2: {
    emoji: '💧',
    title: '回忆星 · 那些小瞬间',
    html: `
      <p>这颗星球上，存着一些关于你的小碎片：</p>
      <p>—— 是课堂上偷偷传过的纸条，<br>
      —— 是课间一起笑到肚子痛的瞬间，<br>
      —— 是那些看似平常、却值得收藏的日子。</p>
      <span class="big">认识你，是件很幸运的事</span>
      <p>谢谢你出现在我们的青春里，<br>愿你一直被温柔以待。</p>
      <div class="typewriter" id="type2"></div>
    `,
    typeText: '> 友情是宇宙里最温柔的引力。'
  },
  3: {
    emoji: '🎁',
    title: '惊喜星 · 一个隐藏彩蛋',
    html: `
      <p>这里藏着一个<span class="accent">为你准备的惊喜</span>。</p>
      <span class="big">点一下下面的按钮<br>看看会发生什么？</span>
      <button class="btn" id="finalBtn" style="font-size:1rem;padding:.8rem 2rem;">🎆 点亮生日烟花</button>
      <div class="typewriter" id="type3"></div>
    `,
    typeText: '> 3...2...1...'
  }
};

/* ========== 4. 点击行星打开内容 ========== */
document.querySelectorAll('.planet').forEach(p => {
  p.addEventListener('click', () => {
    const id = p.dataset.planet;
    const data = planetsData[id];
    if (!data) return;

    storyCard.innerHTML = `
      <span class="emoji">${data.emoji}</span>
      <h3>${data.title}</h3>
      ${data.html}
    `;

    universe.classList.add('hidden');
    content.classList.remove('hidden');

    const tw = document.querySelector('.typewriter');
    if (tw && data.typeText) {
      tw.textContent = '';
      let i = 0;
      setTimeout(() => {
        const timer = setInterval(() => {
          tw.textContent += data.typeText[i];
          i++;
          if (i >= data.typeText.length) clearInterval(timer);
        }, 80);
      }, 500);
    }

    if (id === '3') {
      const finalBtn = document.getElementById('finalBtn');
      if (finalBtn) {
        finalBtn.addEventListener('click', () => {
          triggerFinale();
        });
      }
    }

    visited.add(id);
  });
});

/* ========== 5. 高级烟花粒子系统（canvas 实现） ========== */
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
let W, H;

function resizeCanvas() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const GRAVITY = 0.045;          // 重力
const DRAG = 0.988;             // 空气阻力（拖尾感）

const PALETTES = [
  ['#ffd36e', '#ffb36b', '#ff8c42'],              // 金橙
  ['#f9a8d4', '#f472b6', '#db2777'],              // 粉
  ['#a78bfa', '#8b5cf6', '#6d28d9'],              // 紫
  ['#7dd3fc', '#38bdf8', '#0284c7'],              // 蓝
  ['#c4b5fd', '#f0abfc', '#e879f9'],              // 淡紫粉
  ['#fef08a', '#fde047', '#eab308'],              // 亮黄
  ['#6ee7b7', '#34d399', '#059669'],              // 薄荷绿
];

class Particle {
  constructor(x, y, vx, vy, color, size, life, decay, isTrail = false) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.size = size;
    this.life = life;
    this.maxLife = life;
    this.decay = decay;           // 每帧寿命减少量
    this.isTrail = isTrail;       // 是否是拖尾粒子
    this.alpha = 1;
    this.gravity = GRAVITY * (isTrail ? 0.4 : 1);
  }

  update() {
    this.vx *= DRAG;
    this.vy *= DRAG;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    this.alpha = Math.max(0, this.life / this.maxLife);

    // 拖尾粒子尺寸逐渐变小
    if (this.isTrail) {
      this.size *= 0.985;
    }
    return this.life > 0 && this.size > 0.1;
  }

  draw(ctx) {
    ctx.globalAlpha = this.alpha * (this.isTrail ? 0.55 : 1);
    ctx.fillStyle = this.color;

    if (this.isTrail) {
      // 拖尾小点，用圆形
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 0.8, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // 主粒子带发光（shadowBlur 较耗性能，改用 radial gradient 模拟）
      const r = this.size;
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 2.5);
      grad.addColorStop(0, this.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r * 2.5, 0, Math.PI * 2);
      ctx.fill();
      // 核心亮点
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = this.alpha * 0.6;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

const particles = [];
const trailParticles = [];

// 让粒子数量根据设备性能调整（移动端减少）
const IS_MOBILE = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const QUALITY = IS_MOBILE ? 0.55 : 1;

/**
 * 创建一个烟花爆炸
 * @param {number} x 爆炸中心X
 * @param {number} y 爆炸中心Y
 * @param {number} count 主粒子数
 * @param {Array} palette 颜色数组
 * @param {boolean} secondary 是否为二次爆炸
 */
function createBurst(x, y, count = 80, palette, secondary = false) {
  const colors = palette || PALETTES[Math.floor(Math.random() * PALETTES.length)];
  count = Math.floor(count * QUALITY);

  // 随机球状/环状/心形等分布
  const shape = Math.random();
  const baseSpeed = secondary ? 2.2 : 3.5;
  const speedVar = secondary ? 1.5 : 2.5;

  for (let i = 0; i < count; i++) {
    let angle, speed;
    if (shape < 0.4) {
      // 球状均匀分布
      angle = Math.random() * Math.PI * 2;
      speed = baseSpeed + Math.random() * speedVar;
    } else if (shape < 0.75) {
      // 环状分布（更有层次）
      angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
      speed = baseSpeed + Math.random() * 0.8;
    } else {
      // 心形/花瓣状：多方向聚集
      angle = Math.random() * Math.PI * 2;
      speed = baseSpeed + Math.random() * speedVar * (0.6 + Math.sin(angle * 4) * 0.4);
    }

    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = (Math.random() * 1.6 + 1.2) * (secondary ? 0.8 : 1);
    const life = 60 + Math.random() * 40;          // 帧数
    const decay = 1 / life;

    const vx = Math.cos(angle) * speed;
    const vy = Math.sin(angle) * speed;

    // 主粒子
    particles.push(new Particle(x, y, vx, vy, color, size, life, decay));

    // 每个主粒子附带 1~2 个拖尾粒子（增加飘逸感）
    if (!IS_MOBILE && Math.random() < 0.8) {
      for (let t = 0; t < 2; t++) {
        const trailVx = vx * (0.3 + Math.random() * 0.3);
        const trailVy = vy * (0.3 + Math.random() * 0.3);
        trailParticles.push(new Particle(
          x, y, trailVx, trailVy, color, size * 0.7,
          20 + Math.random() * 20, 1 / (30 + Math.random() * 20), true
        ));
      }
    }
  }

  // 二次爆炸：有一定概率产生小规模的子爆炸，增加层次
  if (!secondary && !IS_MOBILE && Math.random() < 0.5) {
    const subCount = 2 + Math.floor(Math.random() * 2);
    for (let s = 0; s < subCount; s++) {
      setTimeout(() => {
        const ox = x + (Math.random() - 0.5) * 80;
        const oy = y + (Math.random() - 0.5) * 80;
        createBurst(ox, oy, 25 + Math.random() * 20, colors, true);
      }, 200 + Math.random() * 300);
    }
  }

  // 偶尔有闪烁星点
  if (Math.random() < 0.3) {
    for (let i = 0; i < 12; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 40;
      const px = x + Math.cos(angle) * dist;
      const py = y + Math.sin(angle) * dist;
      particles.push(new Particle(
        px, py, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 1.5,
        '#ffffff', Math.random() * 1.5 + 1,
        30 + Math.random() * 30, 1 / 50
      ));
    }
  }
}

/**
 * 发射一个上升的烟花弹（带尾迹），到达高点后爆炸
 */
function launchShell(targetX, targetY) {
  // 起点：底部随机位置
  const startX = Math.random() * W * 0.6 + W * 0.2;
  const startY = H + 10;

  // 控制点产生弧线路径
  const midX = (startX + targetX) / 2 + (Math.random() - 0.5) * 120;
  const midY = (startY + targetY) / 2;

  const duration = 35 + Math.random() * 20; // 帧
  let frame = 0;

  // 用于绘制上升尾迹的粒子数组
  const shellTrail = [];

  function animateShell() {
    frame++;
    const t = frame / duration;
    if (t > 1) {
      // 爆炸！
      const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      createBurst(targetX, targetY, 90 + Math.random() * 50, palette);
      return;
    }

    // 二次贝塞尔曲线插值
    const x = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * midX + t * t * targetX;
    const y = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * midY + t * t * targetY;

    // 添加尾迹粒子
    if (frame % 2 === 0) {
      shellTrail.push(new Particle(
        x, y,
        (Math.random() - 0.5) * 0.6,
        (Math.random() - 0.5) * 0.6 + 0.3,
        '#ffe8b0', Math.random() * 1.5 + 1,
        20 + Math.random() * 15, 1 / 30, true
      ));
    }

    requestAnimationFrame(animateShell);
  }

  animateShell();
}

// 主渲染循环
function render() {
  // 使用 destination-out 制造拖尾残影效果（比 clearRect 更炫）
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  // 更新并绘制主粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (!p.update()) {
      particles.splice(i, 1);
      continue;
    }
    p.draw(ctx);
  }

  // 更新并绘制拖尾粒子
  for (let i = trailParticles.length - 1; i >= 0; i--) {
    const p = trailParticles[i];
    if (!p.update()) {
      trailParticles.splice(i, 1);
      continue;
    }
    p.draw(ctx);
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(render);
}

render();

// 对外暴露的烟花发射函数
function launchRandomFirework() {
  const x = Math.random() * W * 0.8 + W * 0.1;
  const y = Math.random() * H * 0.5 + H * 0.1;
  launchShell(x, y);
}

/* ========== 6. 最终彩蛋 ========== */
const finale = document.getElementById('finale');

function triggerFinale() {
  finale.classList.add('active');

  // 立刻来一波大的
  for (let i = 0; i < 6; i++) {
    setTimeout(() => launchRandomFirework(), i * 180);
  }

  // 持续放烟花
  let fireTimer = setInterval(() => {
    launchRandomFirework();
  }, 650);

  // 12秒后停止自动烟花
  setTimeout(() => {
    clearInterval(fireTimer);
    // 最后再来一波
    for (let i = 0; i < 10; i++) {
      setTimeout(() => launchRandomFirework(), i * 200);
    }
  }, 12000);

  // 点击背景也能放烟花
  finale.addEventListener('click', (e) => {
    if (e.target === finale) {
      // 直接爆炸
      const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      createBurst(e.clientX, e.clientY, 100, palette);
    }
  });
}

/* ========== 7. 点击空白处放小烟花 ========== */
document.addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON' || e.target.closest('.btn') || e.target.closest('.planet') || e.target.closest('.back-btn')) return;
  if (finale.classList.contains('active')) return;

  // 点击处直接爆炸一个小烟花
  const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
  createBurst(e.clientX, e.clientY, 35, palette);
});

/* ========== 8. 键盘快捷键 H 回首页 ========== */
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    intro.classList.remove('hidden');
    universe.classList.add('hidden');
    content.classList.add('hidden');
    finale.classList.remove('active');
    // 清空粒子
    particles.length = 0;
    trailParticles.length = 0;
  }
});
/* ========== 9. 时间系统 + 生日判断（11月22日） ========== */
(function initTimeSystem() {
  const clockEl = document.getElementById('liveClock');
  const greetEl = document.getElementById('timeGreet');
  const badgeEl = document.getElementById('birthdayBadge');
  if (!clockEl || !greetEl) return;

  const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  // ★ 生日配置：11 月 22 日
  const BIRTHDAY_MONTH = 11;  // 11月
  const BIRTHDAY_DAY   = 22;  // 22日

  function getGreeting(hour) {
    if (hour >= 5 && hour < 9)  return '早安，愿今天温柔待你 🌅';
    if (hour >= 9 && hour < 12) return '上午好，元气满满 ☀️';
    if (hour >= 12 && hour < 14) return '中午好，记得好好吃饭 🍱';
    if (hour >= 14 && hour < 18) return '下午好，继续闪闪发光 ✨';
    if (hour >= 18 && hour < 22) return '晚上好，今天辛苦啦 🌙';
    return '夜深了，要早点休息哦 💤';
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // 判断今天是不是 11月22日
  function isBirthdayToday(now) {
    return (now.getMonth() + 1) === BIRTHDAY_MONTH && now.getDate() === BIRTHDAY_DAY;
  }

  // 获取下一个生日目标时间（精确到 0 点）
  function getBirthdayTarget(now) {
    const year = now.getFullYear();
    let target = new Date(year, BIRTHDAY_MONTH - 1, BIRTHDAY_DAY, 0, 0, 0);
    // 如果今年生日已过（含当天过完），则算明年的
    if (now > new Date(year, BIRTHDAY_MONTH - 1, BIRTHDAY_DAY, 23, 59, 59)) {
      target = new Date(year + 1, BIRTHDAY_MONTH - 1, BIRTHDAY_DAY, 0, 0, 0);
    }
    return target;
  }

  // 把毫秒差拆成 天/时/分/秒
  function splitCountdown(ms) {
    if (ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const days    = Math.floor(totalSec / 86400);
    const hours   = Math.floor((totalSec % 86400) / 3600);
    const minutes = Math.floor((totalSec % 3600) / 60);
    const seconds = totalSec % 60;
    return { days, hours, minutes, seconds };
  }

  function update() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    clockEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;

    if (isBirthdayToday(now)) {
      // ★ 生日当天：显示生日徽章，隐藏倒计时
      if (badgeEl) badgeEl.style.display = 'inline-block';
      greetEl.textContent = '今天是你生日 · ' + WEEK[now.getDay()] + ' 🎉';
      // 如果之前有倒计时元素则隐藏
      const cd = document.getElementById('countdownBox');
      if (cd) cd.style.display = 'none';
    } else {
      // 非生日当天：显示问候 + 倒计时
      if (badgeEl) badgeEl.style.display = 'none';
      greetEl.textContent = getGreeting(h) + ' · ' + WEEK[now.getDay()];

            const target = getBirthdayTarget(now);
      const diffMs = target - now;
      const { days, hours, minutes, seconds } = splitCountdown(diffMs);

      let cd = document.getElementById('countdownBox');
      if (!cd) {
        cd = document.createElement('div');
        cd.id = 'countdownBox';
        cd.className = 'countdown';
        greetEl.parentElement.appendChild(cd);
      }
      cd.style.display = 'block';

      // 精确到时分秒
      cd.innerHTML = `距离孙梦羽的生日（11月22日）还有 ` +
        `<strong>${days}</strong> 天 ` +
        `<strong>${pad(hours)}</strong> 时 ` +
        `<strong>${pad(minutes)}</strong> 分 ` +
        `<strong>${pad(seconds)}</strong> 秒 🎈`;
    }
  }

  update();
  setInterval(update, 1000);
})();
console.log('✨ 孙梦羽的生日宇宙已就绪 · 高级烟花系统已加载');
